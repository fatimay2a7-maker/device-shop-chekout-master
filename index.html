<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <title>Device Shop Checkout | devChallenges.io</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="title">
      <h1 class="Check-out-title">Checkout</h1>
      <p class="Check-out-paragraph">3 ITEMS</p>
    </div>
    <div class="container">
      <div class="first">
        <div class="chekout">
          <div class="pic">
            <img src="./resources/Gold.png" alt="iPhone 12 Pro" />
          </div>
          <div class="info">
            <h3>iPhone 12 Pro</h3>
            <p>Golden</p>
            <p class="how-many">x 1</p>
          </div>
          <div class="price">
            <p>$999.00</p>
            <img src="./resources/close-icon.svg" alt="closing icone" />
          </div>

          <div class="pic">
            <img src="./resources/Apple-watch.png" alt="apple watch" />
          </div>
          <div class="info">
            <h3>Apple watch</h3>
            <p>Blue</p>
            <p class="how-many">x 1</p>
          </div>
          <div class="price">
            <p>$399.00</p>
            <img src="./resources/close-icon.svg" alt="closing icone" />
          </div>

          <div class="pic"><img src="./resources/iMac.png" alt="imac" /></div>
          <div class="info">
            <h3>iMac</h3>
            <p>Green</p>
            <p class="how-many">x 1</p>
          </div>
          <div class="price">
            <p>$1199.00</p>
            <img src="./resources/close-icon.svg" alt="closing icone" />
          </div>
          <hr />
        </div>
        <div class="coupon">
          <div>
            <input placeholder="Enter coupon code" type="text" />
          </div>
          <div><button>Apply coupon</button></div>

          <div class="total-bill">
            <p>sub total</p>
            <p>tax</p>
            <p>total</p>
          </div>
          <div class="total-bill-number">
            <p>$2597.00</p>
            <p>$623.28</p>
            <p>$3220.28</p>
          </div>
        </div>
      </div>
      <div class="secend">
        <div class="contact-info">
          <div>
            <h3>Contact Information</h3>
          </div>
          <div>
            <label for="First&Last name">First&Last name</label>
            <input
              placeholder="Enter First & Last name"
              id="First&Last name"
              type="text"
            />
          </div>
          <div>
            <label for="Email Address">Email Address</label>
            <input
              placeholder=" Enter Email Address"
              id="Email Address"
              type="text"
            />
          </div>
        </div>
        <div class="last-part">
          <div class="Country">
            <label for="Country">Country</label>
            <input placeholder="Finland" id="Country" type="text" />
            <img src="" alt="" />
          </div>
          <div class="Postal-Code">
            <label for="Postal Code">Postal Code</label>
            <input placeholder="00270" id="Postal Code" type="text" />
          </div>
          <div class="bt"><button>Continue</button></div>
        </div>
      </div>
    </div>
  </body>
</html>
